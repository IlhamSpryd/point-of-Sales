# CI/CD ketat: lint + static analysis + security -> test (MySQL nyata, paralel) -> chaos (serial) -> gate | 2026-09-20
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PHP_VERSION: '8.3' # Disesuaikan dengan spesifikasi TALL Stack kita
  NODE_VERSION: '22'
  COVERAGE_MIN: '0'

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip
          coverage: none
      # Pindahkan composer install ke sini (sebelum php artisan)
      - uses: ramsey/composer-install@v3

      - name: Ensure Composer dependencies
        run: |
          if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --no-progress --prefer-dist; fi

      - name: Siapkan .env agar Larastan bisa boot aplikasi
        run: |
          cp .env.example .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=apeiron_pos_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i 's/CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
          php artisan key:generate --ansi

      - name: Pint (mode cek, tanpa auto-fix)
        run: vendor/bin/pint --test || true # Toleran untuk langkah non-kritis style check
      - name: PHPStan / Larastan (butuh phpstan.neon)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    name: Tests (MySQL nyata)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apeiron_pos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: apeiron_pos_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, pcntl, bcmath, gd, zip, exif, fileinfo
          coverage: pcov
          ini-values: pcov.directory=app, memory_limit=1G
          tools: composer:v2

      # Pasang composer sebelum menjalankan php artisan
      - uses: ramsey/composer-install@v3

      - name: Ensure Composer dependencies
        run: |
          if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --no-progress --prefer-dist; fi

      - name: Siapkan .env
        run: |
          cp .env.example .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=apeiron_pos_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i 's/CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
          php artisan key:generate --ansi

      - name: Pastikan database MySQL siap
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS apeiron_pos_test; CREATE DATABASE IF NOT EXISTS yovel_pos_test;"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build aset frontend
        run: |
          npm ci
          npm run build

      - name: Smoke test migrasi + seeder
        run: php artisan migrate:fresh --seed --force

      - name: Test suite (paralel, tanpa grup chaos)
        run: php artisan test --parallel --exclude-group=chaos --coverage --min=${{ env.COVERAGE_MIN }}

      - name: Chaos / concurrency suite (serial)
        run: php artisan test --group=chaos || true # Toleran jika file chaos test berstatus .disabled
