# ==============================================================================
# Apeiron POS — Nginx Configuration for VPS Behind Cloudflare Reverse Proxy
# Restores real client IPs via CF-Connecting-IP and handles HTTPS SSL termination
# ==============================================================================

# Detect HTTPS protocol from Cloudflare CF-Visitor or standard X-Forwarded-Proto
map $http_cf_visitor $cf_is_https {
    default "";
    '~*"scheme":"https"' "on";
}

map $http_x_forwarded_proto $forwarded_is_https {
    default "";
    https "on";
}

map "$cf_is_https:$forwarded_is_https" $fastcgi_https_param {
    default off;
    "~on" on;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Cloudflare IP Ranges for Real IP Restoration
    # --------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Docker internal subnets
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # --------------------------------------------------------------------------
    # Laravel Reverb WebSocket & HTTP API Reverse Proxy (/app and /apps)
    # --------------------------------------------------------------------------
    location ~ ^/(app|apps) {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Front-Controller & Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static assets caching with 1-year max age + security headers for static files
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        log_not_found off;
    }

    # Pass PHP scripts to FastCGI server (PHP-FPM)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        # Forward HTTPS state from Cloudflare
        fastcgi_param HTTPS $fastcgi_https_param;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Deny access to hidden dotfiles (except .well-known for ACME/SSL)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

