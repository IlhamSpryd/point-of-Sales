[PHP]
memory_limit = 512M
max_execution_time = 180
max_input_time = 120
post_max_size = 50M
upload_max_filesize = 50M
variables_order = "EGPCS"
expose_php = Off
date.timezone = "Asia/Jakarta"
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

